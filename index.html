<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Territori Comiso</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Territori">
<meta name="theme-color" content="#6E2545">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style id="lkcss">
/* Tutto confinato sotto #lk: allo sblocco questo foglio viene rimosso,
   così non può interferire con lo stile dell'applicazione. */
html{height:100%;background:#F6F3EE}
@media (prefers-color-scheme:dark){html{background:#131110}}
body{height:100%;margin:0;-webkit-font-smoothing:antialiased}
#lk{position:fixed;left:0;right:0;top:0;height:100%;height:100dvh;display:flex;flex-direction:column;
  justify-content:center;padding:28px 24px calc(env(safe-area-inset-bottom) + 28px);overflow-y:auto;
  font:15px/1.45 -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#1D1917;background:#F6F3EE}
@media (prefers-color-scheme:dark){#lk{background:#131110;color:#F1EBE4}}
#lk .in{max-width:380px;margin:0 auto;width:100%}
#lk h1{font-size:30px;font-weight:700;letter-spacing:-.015em;margin:0 0 6px}
#lk p{color:#5E5651;font-size:14.5px;line-height:1.55;margin:0 0 22px}
@media (prefers-color-scheme:dark){#lk p{color:#A79C93}}
#lk label{display:block;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  color:#8A807A;margin-bottom:5px}
#lk input{width:100%;height:48px;padding:0 14px;border-radius:8px;background:#fff;border:1px solid #C7BCAE;
  outline:none;font-size:17px;letter-spacing:.3em;text-align:center;box-sizing:border-box;color:inherit}
@media (prefers-color-scheme:dark){#lk input{background:#1C1917;border-color:#443B36}}
#lk input:focus{border-color:#7A2B4E;box-shadow:0 0 0 3px rgba(122,43,78,.18)}
#lk button{width:100%;height:48px;margin-top:12px;border:none;border-radius:8px;background:#7A2B4E;color:#fff;
  font-size:16px;font-weight:600;cursor:pointer}
#lk button[disabled]{opacity:.5}
#lk .err{color:#B3261E;font-size:13.5px;margin-top:10px;min-height:18px}
#lk .note{margin-top:26px;font-size:12.5px;color:#8A807A;line-height:1.5}
#lk .note a{color:inherit}
</style>
</head>
<body>
<div id="lk"><div class="in">
  <h1>Territori Comiso</h1>
  <p>Questa applicazione è riservata al gruppo di ricerca. Inserisci il codice per aprirla.</p>
  <label for="pw">Codice di accesso</label>
  <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" enterkeyhint="go">
  <button id="go">Apri</button>
  <div class="err" id="er"></div>
  <div class="note">Chi tratta i dati e come: <a href="informativa/">informativa privacy</a>.</div>
</div></div>
<script>
var SALT_LEN = 16, IV_LEN = 12, ITER = 310000, MEM = 'territori.comiso.k';
var pw = document.getElementById('pw'), go = document.getElementById('go'), er = document.getElementById('er');
var blob = null;

function b2a(b){ return new Uint8Array(b); }
async function carica(){
  if (blob) return blob;
  var r = await fetch('app.enc?v=78090c47738a', { cache: 'force-cache' });
  if (!r.ok) throw new Error('rete');
  blob = new Uint8Array(await r.arrayBuffer());
  return blob;
}
async function apri(codice, silenzioso){
  er.textContent = silenzioso ? '' : 'Apertura…';
  go.disabled = true;
  try {
    var d = await carica();
    var salt = d.slice(0, SALT_LEN), iv = d.slice(SALT_LEN, SALT_LEN + IV_LEN), ct = d.slice(SALT_LEN + IV_LEN);
    var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(codice), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt: salt, iterations: ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv: iv }, key, ct);
    var app = JSON.parse(new TextDecoder().decode(plain));
    avvia(app);
  } catch(e) {
    go.disabled = false;
    if (silenzioso){ er.textContent = ''; return false; }
    er.textContent = (e && e.message === 'rete')
      ? 'Non riesco a scaricare l’applicazione. Controlla la connessione.'
      : 'Codice errato.';
    pw.value = ''; pw.focus();
    return false;
  }
  return true;
}
function avvia(app){
  var vecchio = document.getElementById('lkcss');
  if (vecchio) vecchio.remove();                 /* via lo stile della schermata di sblocco */
  var st = document.createElement('style'); st.textContent = app.s; document.head.appendChild(st);
  document.body.innerHTML = app.b;
  var sc = document.createElement('script'); sc.textContent = app.j; document.body.appendChild(sc);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
}
go.onclick = function(){ if (pw.value) apri(pw.value, false); };
pw.onkeydown = function(e){ if (e.key === 'Enter' && pw.value) apri(pw.value, false); };
try { localStorage.removeItem(MEM); } catch(e){}   /* nessuna memoria del codice */
pw.focus();
</script>
</body>
</html>
