<style>
/* ============ TOKENS ============ */
:root{
  --ground:#F6F3EE; --surface:#FFFFFF; --surface-2:#EFEAE2; --surface-3:#E5DED4;
  --ink:#1D1917; --ink-2:#5E5651; --ink-3:#8A807A;
  --line:#DCD3C8; --line-2:#C7BCAE;
  --accent:#7A2B4E; --accent-ink:#FFFFFF; --accent-soft:#F3E4EA; --accent-line:#D9AFC0;
  --st-todo:#CE3E3E; --st-cont:#D69700; --st-vis:#DE6B0A; --st-stud:#25874C; --st-sugg:#2A66C4;
  --st-off:#8C8078; --st-todo-b:#F0DADA; --st-cont-b:#F5E9CB; --st-vis-b:#F7E2D0; --st-stud-b:#D9EDE1; --st-sugg-b:#DCE6F7;
  --map-bg:#EFE9DF; --map-bld:#DDD3C5; --map-bld-l:#CBBFAE; --map-road:#FFFFFF; --map-road-l:#C9BEB0;
  --map-minor:#F7F3EC; --map-water:#BCD3DE; --map-green:#DCE4CE; --map-farm:#E9E4D3; --map-label:#7C736B;
  --danger:#B3261E; --ok:#25874C; --cov:#4E5C6B;
  --shadow:0 1px 2px rgba(29,25,23,.06), 0 8px 24px -8px rgba(29,25,23,.16);
  --shadow-lg:0 2px 6px rgba(29,25,23,.08), 0 24px 56px -16px rgba(29,25,23,.28);
  --r:12px; --r-sm:8px; --r-lg:18px;
  --sans:"IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --cond:"IBM Plex Sans Condensed", "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#131110; --surface:#1C1917; --surface-2:#241F1D; --surface-3:#2E2825;
  --ink:#F1EBE4; --ink-2:#A79C93; --ink-3:#7C7069;
  --line:#332C28; --line-2:#443B36;
  --accent:#D06188; --accent-ink:#1A0E14; --accent-soft:#33191F; --accent-line:#5C2C3C;
  --st-todo:#F06A6A; --st-cont:#F0BE2E; --st-vis:#FF9040; --st-stud:#45C07C; --st-sugg:#6BA2F5;
  --st-off:#8A7E76; --st-todo-b:#3A1C1C; --st-cont-b:#392E12; --st-vis-b:#3B2413; --st-stud-b:#14301F; --st-sugg-b:#152437;
  --map-bg:#171310; --map-bld:#272019; --map-bld-l:#3A2F25; --map-road:#4A4038; --map-road-l:#5E5147;
  --map-minor:#2C2520; --map-water:#1E3038; --map-green:#1E2418; --map-farm:#221E15; --map-label:#9C9086;
  --danger:#F0736B; --ok:#45C07C; --cov:#93A7BC;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 24px 56px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}}
:root[data-theme="dark"]{
  --ground:#131110; --surface:#1C1917; --surface-2:#241F1D; --surface-3:#2E2825;
  --ink:#F1EBE4; --ink-2:#A79C93; --ink-3:#7C7069;
  --line:#332C28; --line-2:#443B36;
  --accent:#D06188; --accent-ink:#1A0E14; --accent-soft:#33191F; --accent-line:#5C2C3C;
  --st-todo:#F06A6A; --st-cont:#F0BE2E; --st-vis:#FF9040; --st-stud:#45C07C; --st-sugg:#6BA2F5;
  --st-off:#8A7E76; --st-todo-b:#3A1C1C; --st-cont-b:#392E12; --st-vis-b:#3B2413; --st-stud-b:#14301F; --st-sugg-b:#152437;
  --map-bg:#171310; --map-bld:#272019; --map-bld-l:#3A2F25; --map-road:#4A4038; --map-road-l:#5E5147;
  --map-minor:#2C2520; --map-water:#1E3038; --map-green:#1E2418; --map-farm:#221E15; --map-label:#9C9086;
  --danger:#F0736B; --ok:#45C07C; --cov:#93A7BC;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 24px -8px rgba(0,0,0,.7);
  --shadow-lg:0 2px 6px rgba(0,0,0,.55), 0 24px 56px -16px rgba(0,0,0,.8);
  color-scheme: dark;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--ground); color:var(--ink); font-family:var(--sans);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior:none; -webkit-tap-highlight-color:transparent;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ============ APP SHELL ============ */
#app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}
.screen{flex:1;position:relative;overflow:hidden;display:none}
.screen.on{display:flex;flex-direction:column}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 16px 32px}

/* nav */
nav.tabs{
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom); flex-shrink:0; z-index:40;
}
nav.tabs button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--ink-3);font-family:var(--cond);font-size:11px;font-weight:600;
  letter-spacing:.04em;text-transform:uppercase;transition:color .15s;
}
nav.tabs button svg{width:22px;height:22px;stroke-width:1.6}
nav.tabs button[aria-current="true"]{color:var(--accent)}

/* header */
.hd{padding:calc(env(safe-area-inset-top) + 14px) 16px 10px;flex-shrink:0}
.hd h1{margin:0;font-family:var(--cond);font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.hd .sub{color:var(--ink-3);font-size:13px;margin-top:1px}
.eyebrow{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-3);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.eyebrow::after{content:"";flex:1;height:1px;background:var(--line)}

/* ============ MAP ============ */
#mapwrap{position:absolute;inset:0;background:var(--map-bg)}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.map-top{position:absolute;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;
  display:flex;flex-direction:column;gap:8px;pointer-events:none;z-index:10}
.searchbar{pointer-events:auto;display:flex;align-items:center;gap:8px;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);padding:0 10px;height:44px;box-shadow:var(--shadow)}
.searchbar input{flex:1;border:none;background:none;outline:none;font-size:16px;min-width:0}
.searchbar svg{width:18px;height:18px;stroke-width:1.8;color:var(--ink-3);flex-shrink:0}
.chips{pointer-events:auto;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 11px;
  border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  font-family:var(--cond);font-size:12.5px;font-weight:600;letter-spacing:.02em;white-space:nowrap;transition:.15s}
.chip[aria-pressed="false"]{opacity:.42}
.chip .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.map-bot{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:8px;z-index:10}
.rnd{width:44px;height:44px;border-radius:12px;background:var(--surface);border:1px solid var(--line);
  box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink-2)}
.rnd svg{width:20px;height:20px;stroke-width:1.7}
.rnd .ago{display:grid;place-items:center;transition:transform .12s linear}
.rnd.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);width:54px;height:54px;border-radius:16px}
.rnd.pri svg{width:26px;height:26px;stroke-width:2}
.rnd.act{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.rnd.pri:not(#b-add){width:44px;height:44px;border-radius:12px}
.rnd.pri:not(#b-add) svg{width:20px;height:20px;stroke-width:2}
#gpsinfo{align-self:flex-end;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:999px;padding:4px 10px;font-family:var(--mono);font-size:11px;white-space:nowrap;margin-bottom:2px}
#scalebar{position:absolute;left:12px;bottom:18px;z-index:9;font-family:var(--mono);font-size:10px;
  color:var(--map-label);pointer-events:none}
#scalebar div{border:1px solid var(--map-label);border-top:none;height:5px;margin-bottom:2px}
.addhint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:11;pointer-events:none;display:none}
body.addmode .addhint{display:block}
.addhint .cross{width:46px;height:46px;position:relative}
.addhint .cross::before,.addhint .cross::after{content:"";position:absolute;background:var(--accent)}
.addhint .cross::before{left:22px;top:0;width:2px;height:46px}
.addhint .cross::after{top:22px;left:0;height:2px;width:46px}
.addbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:12;display:none;gap:8px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px;box-shadow:var(--shadow-lg)}
body.addmode .addbar{display:flex;align-items:center}
body.addmode .map-bot{display:none}
.addbar .t{flex:1;font-size:13px;line-height:1.3}
.addbar .t b{font-family:var(--cond);display:block;font-size:14px}
.covbar{position:absolute;left:12px;right:12px;bottom:14px;z-index:12;display:none;flex-direction:column;gap:9px;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px;box-shadow:var(--shadow-lg)}
body.covmode .covbar{display:flex}
body.covmode .map-bot{display:none}
.covbar .r{display:flex;gap:8px;align-items:center}
.covbar .t{flex:1;min-width:0;font-size:12.5px;color:var(--ink-3);line-height:1.3}
.covbar .t b{font-family:var(--cond);display:block;font-size:14px;color:var(--ink)}

/* ============ COMPONENTS ============ */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 15px;
  border-radius:var(--r-sm);background:var(--surface-2);border:1px solid var(--line);
  font-family:var(--cond);font-weight:600;font-size:14.5px;letter-spacing:.01em;transition:.12s}
.btn svg{width:17px;height:17px;stroke-width:1.9}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.gho{background:none}
.btn.dgr{color:var(--danger);border-color:var(--line)}
.btn.sm{height:34px;padding:0 11px;font-size:13px}
.btn.wide{width:100%}
.btn:active{transform:scale(.985)}
.btn[disabled]{opacity:.4;pointer-events:none}
.row{display:flex;gap:8px}
.row.wrap{flex-wrap:wrap}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:9px}
.card.tap{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left}
.card .stripe{width:4px;border-radius:3px;align-self:stretch;flex-shrink:0;min-height:34px}
.card h3{margin:0;font-family:var(--cond);font-size:16.5px;font-weight:600;line-height:1.25}
.card .meta{color:var(--ink-3);font-size:12.5px;margin-top:2px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card .meta .mono{font-family:var(--mono);font-size:11.5px}

.pill{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;
  font-family:var(--cond);font-size:11.5px;font-weight:600;letter-spacing:.03em;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.pill.todo{background:var(--st-todo-b);color:var(--st-todo)} .pill.todo .dot{background:var(--st-todo)}
.pill.cont{background:var(--st-cont-b);color:var(--st-cont)} .pill.cont .dot{background:var(--st-cont)}
.pill.vis{background:var(--st-vis-b);color:var(--st-vis)}   .pill.vis .dot{background:var(--st-vis)}
.pill.stud{background:var(--st-stud-b);color:var(--st-stud)}.pill.stud .dot{background:var(--st-stud)}
.pill.sugg{background:var(--st-sugg-b);color:var(--st-sugg)}.pill.sugg .dot{background:var(--st-sugg)}
.pill.off{background:var(--surface-2);color:var(--ink-3)}   .pill.off .dot{background:var(--st-off)}
.pill.warn{background:var(--st-vis-b);color:var(--st-vis)}
.pill.lock{background:var(--surface-2);color:var(--ink-3)}

label.f{display:block;margin-bottom:11px}
label.f > span{display:block;font-family:var(--cond);font-size:12px;font-weight:600;letter-spacing:.05em;
  text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.inp,select.inp,textarea.inp{width:100%;height:44px;padding:0 12px;border-radius:var(--r-sm);
  background:var(--surface);border:1px solid var(--line-2);outline:none;font-size:16px;transition:.12s}
textarea.inp{height:auto;min-height:86px;padding:10px 12px;line-height:1.5;resize:vertical}
select.inp{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 17px) 19px, calc(100% - 12px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:4px;line-height:1.4}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px;gap:3px}
.seg button{flex:1;height:34px;border-radius:6px;font-family:var(--cond);font-size:13px;font-weight:600;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tog:last-child{border-bottom:none}
.tog .lb{font-size:14.5px} .tog .lb small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35;margin-top:1px}
.sw{width:46px;height:28px;border-radius:999px;background:var(--surface-3);position:relative;flex-shrink:0;transition:.18s;border:1px solid var(--line-2)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:50%;background:var(--surface);
  box-shadow:0 1px 3px rgba(0,0,0,.28);transition:.18s}
.sw[aria-pressed="true"]{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"]::after{transform:translateX(18px)}

.empty{text-align:center;padding:52px 24px;color:var(--ink-3)}
.empty svg{width:38px;height:38px;stroke-width:1.3;margin-bottom:10px;opacity:.5}
.empty p{margin:0 0 4px;font-family:var(--cond);font-size:17px;font-weight:600;color:var(--ink-2)}
.empty small{font-size:13px;line-height:1.5;display:block;max-width:30ch;margin:0 auto}

/* sheet / modal */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.sheet .veil{position:absolute;inset:0;background:rgba(20,16,14,.45);backdrop-filter:blur(2px);animation:fade .2s}
.sheet .body{position:absolute;left:0;right:0;bottom:0;top:0;background:var(--ground);
  display:flex;flex-direction:column;animation:up .26s cubic-bezier(.2,.8,.3,1)}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(14px);opacity:0}}
.sheet .bar{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
  border-bottom:1px solid var(--line);background:var(--surface);flex-shrink:0}
.sheet .bar h2{flex:1;margin:0;font-family:var(--cond);font-size:17px;font-weight:600;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bar button{font-family:var(--cond);font-weight:600;font-size:14.5px;padding:8px;color:var(--accent)}
.sheet .bar button.x{color:var(--ink-2)}
.sheet .cnt{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px calc(env(safe-area-inset-bottom) + 28px)}
@media (min-width:760px){
  .sheet .body{top:auto;left:50%;transform:translateX(-50%);width:640px;max-width:calc(100vw - 48px);
    height:min(86vh,860px);bottom:24px;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow-lg)}
  .sheet .bar{padding-top:12px}
}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 78px);
  background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:999px;font-size:14px;
  z-index:300;box-shadow:var(--shadow-lg);max-width:calc(100vw - 32px);text-align:center;animation:up .2s}
body.covmode .toast,body.addmode .toast{bottom:calc(env(safe-area-inset-bottom) + 190px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--cond);font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:block}
.kv{display:flex;justify-content:space-between;gap:14px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--ink-3);font-family:var(--cond);font-weight:500;flex-shrink:0}
.kv dd{margin:0;text-align:right;min-width:0;overflow-wrap:anywhere}
.kv dd.mono{font-family:var(--mono);font-size:13px}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px;margin-bottom:12px}
.stat div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px}
.stat b{display:block;font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat small{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.tl{position:relative;padding-left:20px}
.tl::before{content:"";position:absolute;left:4px;top:6px;bottom:6px;width:1.5px;background:var(--line)}
.tl .ev{position:relative;padding:0 0 14px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:5px;width:9px;height:9px;border-radius:50%;
  background:var(--surface);border:2px solid var(--line-2)}
.tl .ev.now::before{background:var(--accent);border-color:var(--accent)}
.tl .ev .d{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);letter-spacing:-.01em}
.tl .ev .t{font-size:14px;margin-top:1px;line-height:1.4}
table.tt{width:100%;border-collapse:collapse;font-size:13.5px}
table.tt th{font-family:var(--cond);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-3);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.tt td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.tt td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.tblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -2px}
.note{background:var(--surface-2);border:1px solid var(--line);border-left:3px solid var(--accent);
  border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;line-height:1.5;margin-bottom:12px}
.note b{font-family:var(--cond)}
.gate{position:fixed;inset:0;z-index:400;background:var(--ground);display:flex;flex-direction:column;
  justify-content:center;padding:28px 24px calc(env(safe-area-inset-bottom) + 28px);overflow-y:auto}
.gate .in{max-width:400px;margin:0 auto;width:100%}
.gate h1{font-family:var(--cond);font-size:31px;font-weight:700;margin:0 0 6px;letter-spacing:-.015em}
.gate p.l{color:var(--ink-2);font-size:14.5px;line-height:1.55;margin:0 0 22px}
.bars{display:flex;align-items:flex-end;gap:3px;height:46px}
.bars i{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.85;display:block}
</style>
</head>
<body>
<svg style="display:none" xmlns="http://www.w3.org/2000/svg"><defs>
<g id="i-map" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4Z"/><path d="M9 4v13M15 6.5v13"/></g>
<g id="i-list" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></g>
<g id="i-grid" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></g>
<g id="i-more" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4M12 8.5h.01"/></g>
<g id="i-search" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></g>
<g id="i-plus" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></g>
<g id="i-loc" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M23 12h-3M4 12H1"/></g>
<g id="i-layer" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3.5 12.5 8.5 4.7 8.5-4.7"/></g>
<g id="i-heat" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s5 4.2 5 8.5A5 5 0 0 1 7 11.5C7 7.2 12 3 12 3Z"/><path d="M12 20.5a3 3 0 0 0 3-3c0-2-3-4-3-4s-3 2-3 4a3 3 0 0 0 3 3Z"/></g>
<g id="i-x" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6 6 18"/></g>
<g id="i-chev" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="m9 5 7 7-7 7"/></g>
<g id="i-pin" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"/><circle cx="12" cy="10" r="2.6"/></g>
<g id="i-lock" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></g>
<g id="i-users" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.4"/><path d="M2.5 20c0-3.6 2.9-5.6 6.5-5.6s6.5 2 6.5 5.6"/><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6.6M18 14.8c2.2.6 3.6 2.4 3.6 5.2"/></g>
<g id="i-north" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 8.6 13.4 12 11.6l3.4 1.8L12 3Z" fill="currentColor" stroke="none"/><path d="M12 3 8.6 13.4 12 11.6l3.4 1.8L12 3Z"/><path d="M7.5 17.5v3.2M7.5 17.5l3 3.2v-3.2M13.8 17.5h2.8l-2.8 3.2h2.8"/></g>
<g id="i-steps" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="18" r="2.3"/><circle cx="18" cy="6" r="2.3"/><path stroke-dasharray="2.6 2.8" d="M7.7 16.3 16.3 7.7"/></g>
<g id="i-dl" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7.5 10.5 12 15l4.5-4.5M4 20h16"/></g>
</defs></svg>

<div id="app">

  <!-- ============ MAPPA ============ -->
  <section class="screen on" id="s-map">
    <div id="mapwrap">
      <canvas id="map"></canvas>
      <div class="addhint"><div class="cross"></div></div>
      <div class="map-top">
        <div class="searchbar">
          <svg viewBox="0 0 24 24"><use href="#i-search"/></svg>
          <input id="q" placeholder="Cerca via, posizione, nazionalità…" autocomplete="off" enterkeyhint="search">
          <button id="qx" style="display:none;color:var(--ink-3)" aria-label="Cancella ricerca"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><use href="#i-x"/></svg></button>
        </div>
        <div class="chips" id="chips"></div>
        <div id="qres"></div>
      </div>
      <div id="scalebar"><div></div><span></span></div>
      <div class="map-bot">
        <div id="gpsinfo" style="display:none"></div>
        <button class="rnd" id="b-north" style="display:none" aria-label="Rimetti la mappa a nord">
          <span class="ago"><svg viewBox="0 0 24 24"><use href="#i-north"/></svg></span></button>
        <button class="rnd" id="b-layers" aria-label="Livelli"><svg viewBox="0 0 24 24"><use href="#i-layer"/></svg></button>
        <button class="rnd" id="b-cov" aria-label="Segna dove avete cercato"><svg viewBox="0 0 24 24"><use href="#i-steps"/></svg></button>
        <button class="rnd" id="b-gps" aria-label="La mia posizione"><svg viewBox="0 0 24 24"><use href="#i-loc"/></svg></button>
        <button class="rnd pri" id="b-add" aria-label="Aggiungi posizione"><svg viewBox="0 0 24 24"><use href="#i-plus"/></svg></button>
      </div>
      <div class="covbar">
        <div class="r">
          <div class="seg" id="cov-seg" style="flex:1">
            <button data-cm="vie" aria-pressed="true">Strade</button>
            <button data-cm="area" aria-pressed="false">Blocco</button>
          </div>
          <button class="chip" id="cov-whole" aria-pressed="false" style="height:34px">Tutta la via</button>
        </div>
        <div class="r">
          <div class="t"><b id="cov-count">Nessuna strada</b><span id="cov-hint">Tocca le strade che avete percorso</span></div>
          <button class="btn sm" id="b-covundo" disabled>Indietro</button>
          <button class="btn gho sm" id="b-covcancel">Esci</button>
          <button class="btn pri sm" id="b-covok">Salva</button>
        </div>
      </div>
      <div class="addbar">
        <div class="t"><b>Punta il centro sul portone</b><span id="addwhere" style="color:var(--ink-3)">—</span></div>
        <button class="btn gho sm" id="b-addcancel">Annulla</button>
        <button class="btn pri sm" id="b-addok">Conferma</button>
      </div>
    </div>
  </section>

  <!-- ============ ELENCO ============ -->
  <section class="screen" id="s-list">
    <div class="hd"><h1>Posizioni</h1><div class="sub" id="list-sub">—</div></div>
    <div style="padding:0 16px 10px"><div class="seg" id="list-seg"></div></div>
    <div class="scroll" id="list-body"></div>
  </section>

  <!-- ============ TERRITORI ============ -->
  <section class="screen" id="s-terr">
    <div class="hd"><h1>Territori</h1><div class="sub">Suddivisione bilanciata per numero di posizioni attive</div></div>
    <div class="scroll" id="terr-body"></div>
  </section>

  <!-- ============ ALTRO ============ -->
  <section class="screen" id="s-more">
    <div class="hd"><h1>Strumenti</h1><div class="sub" id="more-sub">—</div></div>
    <div class="scroll" id="more-body"></div>
  </section>

  <nav class="tabs" id="tabs">
    <button data-t="map" aria-current="true"><svg viewBox="0 0 24 24"><use href="#i-map"/></svg>Mappa</button>
    <button data-t="list"><svg viewBox="0 0 24 24"><use href="#i-list"/></svg>Posizioni</button>
    <button data-t="terr"><svg viewBox="0 0 24 24"><use href="#i-grid"/></svg>Territori</button>
    <button data-t="more"><svg viewBox="0 0 24 24"><use href="#i-more"/></svg>Strumenti</button>
  </nav>
</div>

<div class="sheet" id="sheet">
  <div class="veil" data-close></div>
  <div class="body">
    <div class="bar">
      <button class="x" data-close aria-label="Chiudi"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><use href="#i-x"/></svg></button>
      <h2 id="sh-title">—</h2>
      <button id="sh-action" style="display:none"></button>
    </div>
    <div class="cnt" id="sh-body"></div>
  </div>
</div>
<div class="sheet" id="sheet2">
  <div class="veil" data-close2></div>
  <div class="body">
    <div class="bar">
      <button class="x" data-close2 aria-label="Chiudi"><svg viewBox="0 0 24 24" style="width:22px;height:22px"><use href="#i-x"/></svg></button>
      <h2 id="sh2-title">—</h2>
      <button id="sh2-action" style="display:none"></button>
    </div>
    <div class="cnt" id="sh2-body"></div>
  </div>

const DEF = { me:{ nome:'', id:'', salt:'', ver:'' },
  locations:[], territori:[], affluenza:[], dismissed:[], audit:[], copertura:[],
  settings:{ scadenza:14, retention:24, informativa:false, tema:'auto', copScad:4 } };

/* L'archivio sta in due posti diversi sullo stesso dispositivo: IndexedDB è
   il magazzino principale (capiente e, se il browser concede la persistenza,
   non viene liberato quando la memoria scarseggia), localStorage è la copia
   di scorta. Si scrive su entrambi; alla partenza vince il più recente.
   Nessuno dei due viene mai cancellato dall'app. */
const IDB_NAME = 'territori-comiso', IDB_STORE = 'archivio';
let idb = null;

const idbOpen = () => new Promise(res => {
  let r; try { r = indexedDB.open(IDB_NAME, 1); } catch(e){ return res(null); }
  r.onupgradeneeded = () => { const d = r.result;
    if (!d.objectStoreNames.contains(IDB_STORE)) d.createObjectStore(IDB_STORE); };
  r.onsuccess = () => res(r.result);
  r.onerror = () => res(null);
  r.onblocked = () => res(null);
});
const idbDo = (mode, fn) => new Promise(res => {
  if (!idb) return res(undefined);
  try {
    const t = idb.transaction(IDB_STORE, mode), st = t.objectStore(IDB_STORE);
    let out; const r = fn(st);
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = t.onabort = () => res(undefined);
  } catch(e){ res(undefined); }
});
const idbPut  = (k, v) => idbDo('readwrite', st => st.put(v, k));
const idbGet  = k => idbDo('readonly',  st => st.get(k));
const idbDel  = k => idbDo('readwrite', st => st.delete(k));
const idbKeys = () => idbDo('readonly',  st => st.getAllKeys());

function normalize(o){
  for (const k in DEF) if (!(k in o)) o[k] = structuredClone(DEF[k]);
  for (const k in DEF.settings) if (!(k in o.settings)) o.settings[k] = DEF.settings[k];
  if (!o.settings.v2){ o.settings.copScad = 4; o.settings.v2 = true; }   /* la copertura sparisce dopo 4 mesi */
  return o;
}
const readLocal = () => { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){ return null; } };

/* partenza immediata dalla copia locale: l'app si apre senza attendere il disco */
let DB = normalize(readLocal() || structuredClone(DEF));
let STORAGE = { idb:false, persistente:false, mirror:true, uso:0, quota:0 };

async function initStorage(){
  idb = await idbOpen();
  STORAGE.idb = !!idb;
  const remoto = await idbGet('db');
  /* vince la versione salvata più di recente, mai quella più grande */
  if (remoto && remoto.settings &&
      (remoto.settings.savedAt || '') > (DB.settings.savedAt || '')) DB = normalize(remoto);
  else if (remoto && !DB.settings.savedAt && !DB.locations.length && remoto.locations?.length) DB = normalize(remoto);
  writeAll();                                       /* ripristina la ridondanza a ogni avvio */
  try {
    if (navigator.storage?.persist) STORAGE.persistente = await navigator.storage.persist();
    else if (navigator.storage?.persisted) STORAGE.persistente = await navigator.storage.persisted();
  } catch(e){}
  try { const e = await navigator.storage?.estimate?.(); if (e){ STORAGE.uso = e.usage || 0; STORAGE.quota = e.quota || 0; } } catch(e){}
  await snapshotIfDue();
}

/* scrive su entrambi gli archivi senza toccare i contatori: serve all'avvio
   e ai salvataggi automatici, che non sono modifiche fatte dall'utente */
function writeAll(){
  if (idb) idbPut('db', DB);
  try { localStorage.setItem(KEY, JSON.stringify(DB)); STORAGE.mirror = true; }
  catch(e){
    STORAGE.mirror = false;                         /* troppo grande per localStorage */
    if (!idb) toast('Memoria piena e archivio secondario non disponibile: fai subito un backup.');
  }
}
let saveT = 0;
function save(now){
  DB.settings.savedAt = new Date().toISOString();
  DB.settings.dirty = (DB.settings.dirty || 0) + 1;
  clearTimeout(saveT);
  now ? writeAll() : (saveT = setTimeout(writeAll, 400));
}

/* ---------------- punti di ripristino ---------------- */
/* Una copia al giorno, le ultime sette. Serve contro l'errore umano
   (una cancellazione sbagliata, un import andato storto), non contro la
   perdita del dispositivo: per quella c'è il backup. */
async function snapshotIfDue(force){
  if (!idb) return false;
  if (!force && DB.settings.lastSnap === today()) return false;
  if (!DB.locations.length && !DB.copertura.length) return false;
  DB.settings.lastSnap = today();
  await idbPut('snap-' + Date.now(), {
    il: new Date().toISOString(),
    n: DB.locations.length, p: DB.locations.reduce((a,l) => a + l.persone.length, 0),
    c: DB.copertura.length, data: structuredClone(DB),
  });
  const ks = ((await idbKeys()) || []).filter(k => typeof k === 'string' && k.startsWith('snap-')).sort();
  for (const k of ks.slice(0, Math.max(0, ks.length - 7))) await idbDel(k);
  writeAll();
  return true;
}
async function listSnapshots(){
  const ks = ((await idbKeys()) || []).filter(k => typeof k === 'string' && k.startsWith('snap-')).sort().reverse();
  const out = [];
  for (const k of ks){ const v = await idbGet(k); if (v) out.push({ k, ...v }); }
  return out;
}
async function restoreSnapshot(k){
  const v = await idbGet(k); if (!v || !v.data) return false;
  await snapshotIfDue(true);                        /* prima di sovrascrivere, salva l'attuale */
  DB = normalize(v.data); save(true);
  return true;
}

/* ---------------- cifratura dei campi riservati ---------------- */
let CKEY = null;                       // CryptoKey in memoria, mai persistita
const b64  = b => btoa(String.fromCharCode(...new Uint8Array(b)));
const ub64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const enc  = new TextEncoder(), dec = new TextDecoder();

async function deriveKey(pin, saltB64){
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt:ub64(saltB64), iterations:150000, hash:'SHA-256' },
    base, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']);
}
async function sealText(txt){
  if (!CKEY || !txt) return txt ? { p:txt } : null;      // senza chiave: nessuna cifratura
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, CKEY, enc.encode(txt));
  return { by: DB.me.id, iv: b64(iv), c: b64(ct) };
}
async function openText(blob){
  if (!blob) return '';
  if (blob.p !== undefined) return blob.p;
  if (!CKEY || blob.by !== DB.me.id) return null;        // null = riservato ad altri
  try { const pt = await crypto.subtle.decrypt(
      { name:'AES-GCM', iv:ub64(blob.iv) }, CKEY, ub64(blob.c));
    return dec.decode(pt); } catch(e){ return null; }
}
const isMine = blob => !blob || blob.p !== undefined || blob.by === DB.me.id;

async function setupIdentity(nome, pin){
  DB.me.nome = nome.trim();
  if (!DB.me.id) DB.me.id = nid();
  if (pin){
    DB.me.salt = b64(crypto.getRandomValues(new Uint8Array(16)));
    CKEY = await deriveKey(pin, DB.me.salt);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name:'AES-GCM', iv }, CKEY, enc.encode('ok'));
    DB.me.ver = b64(iv) + '.' + b64(ct);
    sessionStorage.setItem(KEY + '.s', pin);
  }
  save(true);
}
async function unlock(pin){
  if (!DB.me.ver) return true;
  try {
    const k = await deriveKey(pin, DB.me.salt);

function covMetri(){
  let m = 0;
  for (const c of DB.copertura){
    if (c.tipo !== 'vie') continue;
    for (const w of c.ways){
      const f = MAP.roads.find(r => r.w === w); if (!f) continue;

/* ---------------- territori: k-means bilanciato ---------------- */
const TCOLS = ['#C1436A','#2E7BC4','#2E9E5B','#D08A17','#7A4FC0','#0F8C93','#C25E2A','#4A7A2E',
               '#B03A9E','#3A6ED0','#8A6A1F','#1F8F6E','#A03B3B','#5E5AD0','#2F8F3F'];
function convexHull(pts){
  if (pts.length < 3) return pts;
  const p = [...pts].sort((a,b) => a[0]-b[0] || a[1]-b[1]);
  const cr = (o,a,b) => (a[0]-o[0])*(b[1]-o[1]) - (a[1]-o[1])*(b[0]-o[0]);
  const lo = [], up = [];
  for (const q of p){ while (lo.length >= 2 && cr(lo[lo.length-2], lo[lo.length-1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length-1; i >= 0; i--){ const q = p[i];
    while (up.length >= 2 && cr(up[up.length-2], up[up.length-1], q) <= 0) up.pop(); up.push(q); }
  lo.pop(); up.pop(); return lo.concat(up);
}
function splitTerritories(k, opts){
  opts = opts || {};
  const pool = DB.locations.filter(L => opts.all ? true : inTerritorio(L));
  if (pool.length === 0) return { err:'Nessuna posizione da assegnare. Aggiungi posizioni o riduci la soglia di scadenza.' };
  k = Math.max(1, Math.min(15, Math.min(k, pool.length)));
  const P = pool.map(L => { const w = toWorld(L.lat, L.lng); return { id:L.id, x:w[0], y:w[1] }; });
  /* k-means++ */
  let C = [ { x:P[0].x, y:P[0].y } ];
  const rnd = (s => () => (s = s*16807 % 2147483647) / 2147483647)(97);
  while (C.length < k){
    const d2 = P.map(p => Math.min(...C.map(c => (p.x-c.x)**2 + (p.y-c.y)**2)));
    const tot = d2.reduce((a,b) => a+b, 0) || 1;
    let r = rnd() * tot, i = 0;
    while (r > 0 && i < P.length - 1){ r -= d2[i]; i++; }
    C.push({ x:P[i].x, y:P[i].y });
  }
  const cap = Math.ceil(P.length / k);
  let assign = new Array(P.length).fill(0);
  for (let it = 0; it < 15; it++){
    /* assegnazione con capienza: ogni punto va al cluster più vicino ancora libero */
    const cand = [];
    P.forEach((p, i) => C.forEach((c, j) =>
      cand.push([ (p.x-c.x)**2 + (p.y-c.y)**2, i, j ])));
    cand.sort((a,b) => a[0]-b[0]);
    const cnt = new Array(k).fill(0), done = new Array(P.length).fill(false);
    let placed = 0;
    for (const [, i, j] of cand){
      if (done[i] || cnt[j] >= cap) continue;
      done[i] = true; cnt[j]++; assign[i] = j; placed++;
      if (placed === P.length) break;
    }
    const nc = C.map(() => ({ x:0, y:0, n:0 }));
    P.forEach((p, i) => { const c = nc[assign[i]]; c.x += p.x; c.y += p.y; c.n++; });
    let shift = 0;
    nc.forEach((c, j) => { if (!c.n) return;
      const x = c.x/c.n, y = c.y/c.n;
      shift += Math.abs(x - C[j].x) + Math.abs(y - C[j].y); C[j] = { x, y }; });
    if (shift < 0.6) break;
  }
  const out = [];
  for (let j = 0; j < k; j++){
    const mem = P.filter((_, i) => assign[i] === j);
    if (!mem.length) continue;
    const hull = convexHull(mem.map(p => [p.x, p.y]));
    out.push({ id:nid(), name:'Territorio ' + (out.length+1), col:TCOLS[out.length % TCOLS.length],
      ids:mem.map(m => m.id), cx:C[j].x, cy:C[j].y, hull, creato:today(), assegnato:'' });
  }
  out.forEach(t => t.ids.forEach(id => { const L = getLoc(id); if (L) L.territorio = t.id; }));
  DB.locations.forEach(L => { if (!out.some(t => t.ids.includes(L.id))) L.territorio = null; });
  DB.territori = out; TERR = out; save(true);
  return { ok:out.length };
}
function rebuildTerr(){
  TERR = DB.territori.map(t => ({ ...t,
    ids: t.ids.filter(id => getLoc(id)),
    hull: t.hull || [] }));
}
/* comando testuale: "dividi comiso in 6 territori" */
function runCommand(txt){
  const s = txt.toLowerCase();
  const m = s.match(/(\d+)\s*(territor|zone|parti|gruppi)/) || s.match(/in\s+(\d+)/);
  if (/divid|suddivid|spezz|crea .*territor/.test(s) && m){
    const r = splitTerritories(parseInt(m[1],10), { all:/tutte|tutto|incluse/.test(s) });
    if (r.err) return { msg:r.err };

    return { msg:'Create ' + r.ok + ' territori bilanciati.', go:'terr' };

    return { msg:'Territori azzerati.' };

  return { msg:'Comando non riconosciuto. Prova: “dividi Comiso in 6 territori”.' };
}
/* =========================================================================
   MAPPA — renderer vettoriale su canvas. Nessuna richiesta di rete:
   la cartografia OSM di Comiso è incorporata nella pagina.
   ========================================================================= */
const KX = Math.cos(36.95 * Math.PI / 180);           // correzione longitudine
const LAT0 = BM.o[1], LON0 = BM.o[0], SC = BM.s;      // origine e scala del basemap
const M_PER_U = 1.1132;                                // metri per unità mondo

const toWorld = (lat, lng) => [ (lng - LON0) * SC * KX, -(lat - LAT0) * SC ];
const toLL    = (px, py)   => [ LAT0 - py / SC, LON0 + px / (SC * KX) ];

function decode(d){ // delta -> assoluto, in coordinate proiettate
  const n = d.length >> 1, a = new Float32Array(n * 2);
  let x = 0, y = 0;
  for (let i = 0; i < n; i++){ x += d[i*2]; y += d[i*2+1]; a[i*2] = x * KX; a[i*2+1] = -y; }
  return a;
}
function bbox(a){
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (let i = 0; i < a.length; i += 2){
    if (a[i] < x0) x0 = a[i]; if (a[i] > x1) x1 = a[i];
    if (a[i+1] < y0) y0 = a[i+1]; if (a[i+1] > y1) y1 = a[i+1];
  }
  return [x0, y0, x1, y1];
}
const MAP = { roads:[], bld:[], water:[], lu:[], poi:[], bnd:[] };
(function build(){
  for (const r of BM.roads){ const p = decode(r[2]); MAP.roads.push({ c:r[0], n:r[1], p, b:bbox(p), w:r[3] }); }
  for (const w of BM.bld)  { const p = decode(w);    MAP.bld.push({ p, b:bbox(p) }); }
  for (const w of BM.water){ const p = decode(w[1]); MAP.water.push({ f:w[0], p, b:bbox(p) }); }
  for (const w of BM.lu)   { const p = decode(w[1]); MAP.lu.push({ k:w[0], p, b:bbox(p) }); }
  for (const w of BM.bnd)  { const p = decode(w);    MAP.bnd.push({ p, b:bbox(p) }); }
  for (const p of BM.poi)  { MAP.poi.push({ n:p[0], k:p[1], x:p[2]*KX, y:-p[3] }); }
  BM.streets = BM.streets.map(s => ({ n:s[0], x:s[1][0]*KX, y:-s[1][1] }));
})();

const cv = document.getElementById('map'), cx2 = cv.getContext('2d', { alpha:false });
/* il canvas non risolve var(--…): le famiglie vanno scritte per esteso */
const FCOND = '"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif';
const FSANS = '"IBM Plex Sans",system-ui,sans-serif';
const FMONO = '"IBM Plex Mono",ui-monospace,monospace';
let W = 0, H = 0, DPR = 1;
const view = { x:0, y:0, z:0.42, rot:0 };
(function initView(){ const w = toWorld(36.9490, 14.6070); view.x = w[0]; view.y = w[1]; })();

let dirty = true, raf = 0;
const invalidate = () => { if (!raf) raf = requestAnimationFrame(draw); dirty = true; };

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  const r = cv.getBoundingClientRect();
  W = Math.round(r.width); H = Math.round(r.height);
  cv.width = W * DPR; cv.height = H * DPR;

/* proiezione con rotazione: CO e SI sono ricalcolati a ogni disegno,
   così il seno e il coseno non si ripetono per ogni singolo vertice */
let CO = 1, SI = 0;
const syncRot = () => { CO = Math.cos(view.rot); SI = Math.sin(view.rot); };
const S  = (px, py) => { const dx = px - view.x, dy = py - view.y;
  return [ (dx*CO - dy*SI) * view.z + W/2, (dx*SI + dy*CO) * view.z + H/2 ]; };
const SX = (px, py) => ((px - view.x)*CO - (py - view.y)*SI) * view.z + W/2;
const SY = (px, py) => ((px - view.x)*SI + (py - view.y)*CO) * view.z + H/2;
const unS = (sx, sy) => { const ux = (sx - W/2) / view.z, uy = (sy - H/2) / view.z;
  return [ view.x + ux*CO + uy*SI, view.y - ux*SI + uy*CO ]; };
/* con la mappa ruotata la finestra visibile è un rettangolo inclinato:
   per il taglio serve il rettangolo dritto che lo contiene tutto */
function viewBox(m){
  const pad = (m || 40) / view.z;
  const hw = W/2/view.z, hh = H/2/view.z;
  const ex = Math.abs(hw*CO) + Math.abs(hh*SI) + pad;
  const ey = Math.abs(hw*SI) + Math.abs(hh*CO) + pad;
  return [ view.x - ex, view.y - ey, view.x + ex, view.y + ey ];
}
const hit = (b, v) => !(b[2] < v[0] || b[0] > v[2] || b[3] < v[1] || b[1] > v[3]);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function path(ctx, p, close){
  ctx.beginPath();
  ctx.moveTo(SX(p[0], p[1]), SY(p[0], p[1]));
  for (let i = 2; i < p.length; i += 2) ctx.lineTo(SX(p[i], p[i+1]), SY(p[i], p[i+1]));
  if (close) ctx.closePath();
}
/* larghezza tratto per classe stradale, in px, dipendente dallo zoom */
const RW = [ [8,1.8], [6.5,1.5], [5.4,1.3], [4.6,1.1], [3.6,.85], [2.4,.7], [2,.6], [1.6,.5] ];
const rw = c => Math.max(RW[c][1], Math.min(RW[c][0], RW[c][0] * view.z * 1.5));

function draw(){
  raf = 0; if (!dirty) return; dirty = false;
  syncRot();
  const g = cx2; g.save(); g.scale(DPR, DPR);
  const v = viewBox();
  g.fillStyle = css('--map-bg'); g.fillRect(0, 0, W, H);

  /* uso del suolo */
  if (view.z > 0.03){
    for (const f of MAP.lu){
      if (!hit(f.b, v)) continue;
      g.fillStyle = (f.k === 'farmland' || f.k === 'greenhouse_horticulture') ? css('--map-farm')
                  : (f.k === 'forest' || f.k === 'cemetery') ? css('--map-green') : css('--map-minor');
      path(g, f.p, true); g.fill();
    }
  }
  for (const f of MAP.water){ if (!hit(f.b, v)) continue;
    if (f.f){ g.fillStyle = css('--map-water'); path(g, f.p, true); g.fill(); }
    else { g.strokeStyle = css('--map-water'); g.lineWidth = Math.max(1, 2*view.z); path(g, f.p); g.stroke(); }
  }
  /* confine comunale */
  g.strokeStyle = css('--line-2'); g.lineWidth = 1.5; g.setLineDash([7,5]);
  for (const f of MAP.bnd){ if (hit(f.b, v)) { path(g, f.p, true); g.stroke(); } }
  g.setLineDash([]);

  /* edifici */
  if (layers.bld && view.z > 0.3){
    g.fillStyle = css('--map-bld'); g.strokeStyle = css('--map-bld-l'); g.lineWidth = .6;
    for (const f of MAP.bld){ if (!hit(f.b, v)) continue; path(g, f.p, true); g.fill(); if (view.z > 1.4) g.stroke(); }
  }
  /* strade: prima i bordi, poi il riempimento */
  const maxc = view.z > 1.1 ? 7 : view.z > .45 ? 6 : view.z > .10 ? 4 : view.z > .045 ? 3 : 2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = css('--map-road-l');
  for (const f of MAP.roads){ if (f.c > maxc || !hit(f.b, v)) continue;
    g.lineWidth = rw(f.c) + (view.z > .6 ? 1.3 : .8); path(g, f.p); g.stroke(); }
  for (const f of MAP.roads){ if (f.c > maxc || !hit(f.b, v)) continue;
    g.strokeStyle = f.c >= 5 ? css('--map-minor') : css('--map-road');
    g.lineWidth = rw(f.c); path(g, f.p); g.stroke(); }

  if (layers.cov) drawCoverage(g, v);
  if (layers.aree) drawAreas(g, v);
  if (layers.heat) drawHeat(g, v);
  if (layers.terr) drawTerr(g, v);

  drawLabels(g, v);
  drawMarkers(g, v);
  g.restore();
  scaleBar();
}

/* ---------- etichette: vie, piazze, contrade, luoghi ----------
   Un'etichetta viene disegnata solo se trova posto libero: le priorità
   alte vengono prima e vincono lo spazio. */
function drawLabels(g, v){
  const boxes = [], halo = css('--map-bg'), col = css('--map-label');
  const free = (x, y, w, h) => {
    for (const b of boxes)
      if (!(x + w/2 < b[0] - b[2]/2 || x - w/2 > b[0] + b[2]/2 ||
            y + h/2 < b[1] - b[3]/2 || y - h/2 > b[1] + b[3]/2)) return false;
    boxes.push([x, y, w, h]); return true;
  };
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const put = (t, x, y, font, colour, ang) => {
    g.font = font;
    const tw = g.measureText(t).width, w = tw + 9, h = 14;
    const ca = Math.abs(Math.cos(ang || 0)), sa = Math.abs(Math.sin(ang || 0));
    const bw = w * ca + h * sa, bh = w * sa + h * ca;
    if (x < -bw || y < -bh || x > W + bw || y > H + bh) return false;
    if (!free(x, y, bw, bh)) return false;
    g.save(); g.translate(x, y); if (ang) g.rotate(ang);
    g.lineJoin = 'round'; g.lineWidth = 3.4; g.strokeStyle = halo; g.strokeText(t, 0, 0);
    g.fillStyle = colour; g.fillText(t, 0, 0); g.restore();
    return true;
  };
  /* 1. centri abitati e frazioni */
  for (const p of MAP.poi){
    if (!p.n || !p.k.startsWith('place:')) continue;
    const k = p.k.slice(6);
    if (k === 'town') { if (view.z > 1.2) continue; }
    else if (k === 'village' || k === 'hamlet') { if (view.z > 2) continue; }
    else if (view.z < 0.16 || view.z > 1.6) continue;
    const big = k === 'town' || k === 'village';
    put(k === 'town' ? p.n.toUpperCase() : p.n, SX(p.x, p.y), SY(p.x, p.y),
        (big ? '600 ' : '500 ') + (big ? 14 : 11) + 'px ' + FCOND,
        css('--ink-3'), 0);
  }
  /* 2. nomi delle strade, scritti lungo la strada */
  if (view.z > 0.32){
    const maxc = view.z > 1.6 ? 7 : view.z > 1.1 ? 5 : view.z > 0.85 ? 4 : 2;
    const vicino = view.z > 2.4;                       /* da vicino il nome si ripete lungo la via */
    const minGap = vicino ? 190 : 240;
    const seen = new Map();
    const list = MAP.roads.filter(f => f.n && f.c <= maxc && hit(f.b, v))
                          .sort((a, b) => a.c - b.c);
    for (const f of list){
      /* il nome sta sul tratto dritto più lungo: è lì che ci sta comodo e si legge */
      let bi = -1, bl = 0;
      for (let i = 2; i < f.p.length; i += 2){
        const ax = SX(f.p[i-2], f.p[i-1]), ay = SY(f.p[i-2], f.p[i-1]);
        const bx = SX(f.p[i], f.p[i+1]), by = SY(f.p[i], f.p[i+1]);
        const l = (bx-ax)*(bx-ax) + (by-ay)*(by-ay);
        if (l > bl){ bl = l; bi = i; }
      }
      if (bi < 0) continue;
      const ax = SX(f.p[bi-2], f.p[bi-1]), ay = SY(f.p[bi-2], f.p[bi-1]);
      const bx = SX(f.p[bi], f.p[bi+1]), by = SY(f.p[bi], f.p[bi+1]);
      const x = (ax+bx)/2, y = (ay+by)/2;

      if (prev.some(q => Math.hypot(q[0] - x, q[1] - y) < minGap)) continue;

      const size = vicino ? (f.c <= 2 ? 13 : 12) : (f.c <= 2 ? 11.5 : 10.5);
      /* se il tratto è più corto del nome, l'etichetta non ci sta: meglio nessuna */
      g.font = '500 ' + size + 'px ' + FCOND;
      if (!piazza && Math.sqrt(bl) < g.measureText(f.n).width + 10) continue;
      if (put(f.n, x, y, '500 ' + size + 'px ' + FCOND, col, piazza ? 0 : a)){
        prev.push([x, y]); seen.set(f.n, prev);
      }
      if (boxes.length > (vicino ? 200 : 130)) break;
    }
  }
  /* 3. punti di riferimento: chiese, municipio, scuole, mercati, negozi */
  if (view.z > 1.25){
    const maxr = view.z > 2.8 ? 3 : view.z > 2 ? 2 : 1;
    const ink3 = css('--ink-3'), ink2 = css('--ink-2');
    const list = MAP.poi.filter(p => p.n && !p.k.startsWith('place:') &&
                                POI_RANK[p.k] !== undefined && POI_RANK[p.k] <= maxr)
                        .sort((a, b) => POI_RANK[a.k] - POI_RANK[b.k]);
    for (const p of list){
      const x = SX(p.x, p.y), y = SY(p.x, p.y);
      if (x < -40 || y < -20 || x > W + 40 || y > H + 20) continue;
      const r = POI_RANK[p.k];
      g.beginPath(); g.arc(x, y, r === 0 ? 3.2 : 2.5, 0, 6.284);
      g.fillStyle = r === 0 ? ink2 : ink3; g.globalAlpha = r === 0 ? .85 : .5; g.fill(); g.globalAlpha = 1;
      put(p.n, x, y - 9, (r === 0 ? '600 ' : '500 ') + (r === 0 ? 10.5 : 10) + 'px ' + FSANS,
          r === 0 ? ink2 : ink3, 0);
      if (boxes.length > 260) break;
    }

}
function scaleBar(){

function drawCoverage(g, v){
  const c0 = css('--cov');

    g.save(); g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = c0;
    const dash = Math.max(5, 11 * view.z), gap = Math.max(3.5, 7 * view.z);
    for (const f of MAP.roads){
      const a = COVIDX.get(f.w);
      if (a === undefined || !hit(f.b, v)) continue;
      g.globalAlpha = a; g.lineWidth = rw(f.c) + 3.2;
      g.setLineDash([dash, gap]); path(g, f.p); g.stroke();
    }
    g.restore();
  }

    if (c.tipo !== 'area' || !c.poly || c.poly.length < 3) continue;
    g.save(); polyScreen(g, c.poly);
    g.globalAlpha = covAlpha(c) * .28; g.fillStyle = c0; g.fill();
    g.clip();
    /* tratteggio diagonale: dice "battuto" senza coprire la mappa */
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
    for (const p of c.poly){ const w = toWorld(p[0], p[1]), q = S(w[0], w[1]);
      x0 = Math.min(x0, q[0]); x1 = Math.max(x1, q[0]); y0 = Math.min(y0, q[1]); y1 = Math.max(y1, q[1]); }
    g.globalAlpha = covAlpha(c) * .6; g.strokeStyle = c0; g.lineWidth = 1;
    g.beginPath();
    const H = y1 - y0;
    for (let x = x0 - H; x < x1 + 2; x += 12){ g.moveTo(x, y1); g.lineTo(x + H, y0); }
    g.stroke();
    g.restore();
    g.save(); polyScreen(g, c.poly);
    g.globalAlpha = Math.min(1, covAlpha(c) + .2); g.strokeStyle = c0; g.lineWidth = 1.6; g.stroke();
    g.restore();
  }
  /* selezione in corso */
  if (PENDW.size){
    g.save(); g.lineCap = 'round'; g.strokeStyle = css('--accent'); g.globalAlpha = .85;
    for (const f of MAP.roads){
      if (!PENDW.has(f.w) || !hit(f.b, v)) continue;
      g.lineWidth = rw(f.c) + 4.5; path(g, f.p); g.stroke();
    }
    g.restore();
  }
  if (PENDP.length){
    g.save(); g.strokeStyle = css('--accent'); g.fillStyle = css('--accent');
    g.lineWidth = 2; g.setLineDash([5,4]);
    g.beginPath();
    PENDP.forEach((p, i) => { const w = toWorld(p[0], p[1]), q = S(w[0], w[1]);
      i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); });
    if (PENDP.length > 2) g.closePath();
    g.stroke(); g.setLineDash([]);
    g.globalAlpha = .18; if (PENDP.length > 2) g.fill();
    g.globalAlpha = 1;
    PENDP.forEach(p => { const w = toWorld(p[0], p[1]), q = S(w[0], w[1]);
      g.beginPath(); g.arc(q[0], q[1], 5, 0, 6.284); g.fill();
      g.strokeStyle = css('--surface'); g.lineWidth = 2; g.stroke(); g.strokeStyle = css('--accent'); });
    g.restore();
  }
}
/* strada più vicina a un punto sullo schermo, entro una soglia in pixel */
function roadAt(sx, sy, tolPx){
  const p = unS(sx, sy), tol = (tolPx || 22) / view.z;
  let best = null, bd = tol * tol;
  for (const f of MAP.roads){
    if (p[0] < f.b[0] - tol || p[0] > f.b[2] + tol || p[1] < f.b[1] - tol || p[1] > f.b[3] + tol) continue;
    for (let i = 2; i < f.p.length; i += 2){
      const ax = f.p[i-2], ay = f.p[i-1], bx = f.p[i], by = f.p[i+1];
      const dx = bx - ax, dy = by - ay, l2 = dx*dx + dy*dy;
      let t = l2 ? ((p[0]-ax)*dx + (p[1]-ay)*dy) / l2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const qx = ax + t*dx, qy = ay + t*dy;
      const d = (p[0]-qx)**2 + (p[1]-qy)**2;
      if (d < bd){ bd = d; best = f; }
    }

let HEATC = null;
function drawHeat(g){

  const w2 = Math.max(1, Math.ceil(W/2)), h2 = Math.max(1, Math.ceil(H/2));
  if (!HEATC) HEATC = document.createElement('canvas');
  HEATC.width = w2; HEATC.height = h2;
  const hg = HEATC.getContext('2d');
  hg.clearRect(0,0,w2,h2);
  const R = Math.max(22, Math.min(90, 40 * Math.max(.35, view.z)));
  for (const p of src){
    const wd = toWorld(p[0], p[1]), x = SX(wd[0], wd[1])/2, y = SY(wd[0], wd[1])/2;
    if (x < -R || y < -R || x > w2+R || y > h2+R) continue;
    const grd = hg.createRadialGradient(x, y, 0, x, y, R);
    const a = .2 * (p[2] || 1);
    grd.addColorStop(0, 'rgba(0,0,0,' + a + ')'); grd.addColorStop(1, 'rgba(0,0,0,0)');
    hg.fillStyle = grd; hg.beginPath(); hg.arc(x, y, R, 0, 6.284); hg.fill();
  }

  const RAMP = [[0,60,20,90],[.3,120,35,110],[.55,190,55,95],[.8,225,110,45],[1,245,205,110]];

    const t = Math.min(1, a / 150);

    const f = (t - RAMP[k][0]) / (RAMP[k+1][0] - RAMP[k][0] || 1);
    d[i]   = RAMP[k][1] + (RAMP[k+1][1] - RAMP[k][1]) * f;
    d[i+1] = RAMP[k][2] + (RAMP[k+1][2] - RAMP[k][2]) * f;
    d[i+2] = RAMP[k][3] + (RAMP[k+1][3] - RAMP[k][3]) * f;

}

  if (COVMODE) return covTap(sx, sy);
  let best = null, bd = 1e9;
  for (const m of MARKS){ const d = Math.hypot(m.x - sx, m.y - sy); if (d < m.r && d < bd){ bd = d; best = m; } }
  if (best){ best.t === 'l' ? openLoc(best.id) : openSugg(best.i); }
}
function flyTo(lat, lng, z){
  const w = toWorld(lat, lng);
  view.x = w[0]; view.y = w[1]; if (z) view.z = z;
  onMove(); invalidate();
}
function fitBounds(pts, padPx){
  if (!pts.length) return;
  view.rot = 0; syncRot(); northBtn();             /* inquadrare qualcosa significa rimetterlo a nord */
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for (const p of pts){ const w = toWorld(p[0], p[1]);
    x0=Math.min(x0,w[0]); x1=Math.max(x1,w[0]); y0=Math.min(y0,w[1]); y1=Math.max(y1,w[1]); }
  const pad = padPx || 70;
  view.x = (x0+x1)/2; view.y = (y0+y1)/2;
  const zx = (W - pad*2) / Math.max(1, x1-x0), zy = (H - pad*2) / Math.max(1, y1-y0);
  view.z = Math.max(0.012, Math.min(4, Math.min(zx, zy)));
  onMove(); invalidate();
}
/* via più vicina al centro schermo — usata per precompilare l'indirizzo */
function nearestStreet(px, py){
  let best = null, bd = 1e9;
  for (const f of MAP.roads){
    if (!f.n) continue;
    for (let i = 0; i < f.p.length; i += 2){
      const d = (f.p[i]-px)**2 + (f.p[i+1]-py)**2;
      if (d < bd){ bd = d; best = f.n; }
    }
  }
  return { name: best, dist: Math.sqrt(bd) * M_PER_U };
}

    document.getElementById('addwhere').textContent =
      (ns.name ? ns.name + ' · ' : '') + ll[0].toFixed(5) + ', ' + ll[1].toFixed(5);
  }
}

/* ---------------- posizione in tempo reale ----------------
   Tre stati sul pulsante: spento, acceso-e-inseguo, acceso-e-fermo.
   Trascinando la mappa si sgancia l'inseguimento ma il puntino continua
   ad aggiornarsi: serve per guardare la via accanto senza perdersi. */
function setFollow(on){
  FOLLOW = on;
  const b = $('#b-gps');
  b.classList.toggle('pri', on);
  b.classList.toggle('act', !on && !!WATCH);
  if (on && GPS) flyTo(GPS.lat, GPS.lng, Math.max(view.z, 2.6));
}
function gpsInfo(){
  const el = $('#gpsinfo'); if (!el) return;
  if (!WATCH){ el.style.display = 'none'; return; }
  el.style.display = '';
  el.textContent = !GPS ? 'ricerca del segnale…'
    : '±' + Math.round(GPS.acc) + ' m' + (GPS.acc > 40 ? ' · segnale debole' : '');
  el.style.color = GPS && GPS.acc > 40 ? 'var(--st-vis)' : 'var(--ink-3)';
}
function stopGPS(){
  if (WATCH){ navigator.geolocation.clearWatch(WATCH); WATCH = 0; }
  GPS = null; HEADING = null; setFollow(false);
  $('#b-gps').classList.remove('act', 'pri');
  gpsInfo(); invalidate();
}
function startGPS(){
  if (!navigator.geolocation) return toast('Il telefono non fornisce la posizione.');
  WATCH = navigator.geolocation.watchPosition(
    p => {
      const first = !GPS;
      GPS = { lat:p.coords.latitude, lng:p.coords.longitude,
              acc:p.coords.accuracy || 0,
              heading:(p.coords.speed > 0.6 ? p.coords.heading : null) };
      if (FOLLOW) flyTo(GPS.lat, GPS.lng, first ? Math.max(view.z, 2.6) : view.z);
      gpsInfo(); invalidate();
    },
    err => {
      stopGPS();
      toast(err.code === 1
        ? 'Permesso negato. Attivalo in Impostazioni › Safari › Posizione.'
        : 'Posizione non disponibile: prova all’aperto.');
    },
    { enableHighAccuracy:true, maximumAge:2000, timeout:15000 });
  setFollow(true); gpsInfo();
  toast('Ricerca del segnale…');
  askCompass();
}
/* bussola: su iPhone va chiesta esplicitamente, e solo dentro un tocco */
async function askCompass(){
  try {
    const D = window.DeviceOrientationEvent;
    if (D && typeof D.requestPermission === 'function'){
      if (await D.requestPermission() !== 'granted') return;
    } else if (!D) return;
    addEventListener('deviceorientation', e => {
      const h = e.webkitCompassHeading != null ? e.webkitCompassHeading
              : (e.absolute && e.alpha != null ? 360 - e.alpha : null);
      if (h != null && !isNaN(h)){ HEADING = h; invalidate(); }
    }, { passive:true });
  } catch(e){}
}
$('#b-gps').onclick = () => {
  if (!WATCH) return startGPS();
  if (FOLLOW) return stopGPS();
  setFollow(true);                                  /* acceso ma sganciato: ricentra */
};

    t.textContent = 'Tocca gli angoli del blocco; l’ultimo punto si chiude da solo';

function covTap(sx, sy){
  if (COVMODE === 'area'){
    const p = unS(sx, sy), ll = toLL(p[0], p[1]);
    /* un tocco vicino al primo angolo lo rimuove, così si corregge senza uscire */
    if (PENDP.length){
      const w0 = toWorld(PENDP[PENDP.length-1][0], PENDP[PENDP.length-1][1]), q = S(w0[0], w0[1]);
      if (Math.hypot(q[0]-sx, q[1]-sy) < 16){ PENDP.pop(); covStatus(); invalidate(); return; }
    }
    PENDP.push([ll[0], ll[1]]); covStatus(); invalidate(); return;
  }
  const f = roadAt(sx, sy, 24);
  if (!f) return toast('Nessuna strada sotto il dito: avvicina lo zoom e riprova.');
  const targets = (COVWHOLE && f.n) ? MAP.roads.filter(r => r.n === f.n) : [f];
  const on = targets.every(r => PENDW.has(r.w));
  const ids = targets.map(r => r.w).filter(w => on ? PENDW.has(w) : !PENDW.has(w));
  targets.forEach(r => on ? PENDW.delete(r.w) : PENDW.add(r.w));
  if (ids.length) PENDSTACK.push({ add: !on, ids });
  covStatus(); invalidate();
}

   '<label class="f"><span>Coordinate</span><input class="inp" id="f-ll" value="' + L.lat.toFixed(6) + ', ' + L.lng.toFixed(6) + '"></label>' +
   '<p class="hint">Sposta la mappa e usa “+” per creare un punto già posizionato, oppure incolla qui le coordinate copiate da Google Maps.</p>',
   { label:'Salva', fn: async () => {
      L.via = $('#f-via').value.trim(); L.civ = $('#f-civ').value.trim(); L.interno = $('#f-int').value.trim();
      L.nucleo.n = Math.max(0, parseInt($('#f-n').value || '0', 10)); L.nucleo.note = $('#f-nn').value.trim();
      L.note = $('#f-note').value.trim(); L.resp = $('#f-resp').value.trim();
      const pv = $('#f-priv').value.trim(); if (pv) L.priv.note = await sealText(pv);
      const m = $('#f-ll').value.split(',').map(s => parseFloat(s.trim()));
      if (m.length === 2 && !isNaN(m[0]) && !isNaN(m[1])){ L.lat = m[0]; L.lng = m[1]; }
      L.agg = new Date().toISOString(); save(true);
      closeSheet2(); invalidate(); renderChips(); openLoc(id); toast('Posizione salvata.');
   }});
  openText(L.priv.note).then(v => { if (v) $('#f-priv').value = v; });
  if (isNew) setTimeout(() => $('#f-civ')?.focus(), 380);
}

const SHARE_FIELDS = [
  ['via','Via'], ['civ','Civico'], ['interno','Interno'], ['coord','Coordinate'],
  ['gmaps','Link Google Maps'], ['stato','Stato'], ['npers','Persone in casa'],
  ['nucleo','Note nucleo'], ['note','Note generali'], ['resp','Chi conduce'],
  ['terr','Territorio'], ['ultimo','Data ultimo contatto'], ['storia','Cronologia completa'],
  ['iniz','Iniziali persone'], ['naz','Nazionalità'], ['lingue','Lingue'],
  ['eng','Parla inglese'], ['ruolo','Ruolo'], ['pnote','Note persona'], ['autore','Inserita da'],
];
const SHARE_DEF = ['via','civ','interno','coord','gmaps','stato','npers','nucleo','terr','ultimo','iniz','naz','eng'];
let SHARE = [...SHARE_DEF];

function rowOf(L, f){
  const t = DB.territori.find(x => x.id === L.territorio);
  const P = L.persone;
  const m = {
    via:L.via, civ:L.civ, interno:L.interno,
    coord:L.lat.toFixed(6) + ', ' + L.lng.toFixed(6), gmaps:gmaps(L),
    stato:STATI[L.stato].l, npers:L.nucleo.n, nucleo:L.nucleo.note, note:L.note || '',
    resp:L.resp, terr:t ? t.name : '', ultimo:lastDate(L),
    storia:L.eventi.map(e => fmtD(e.il) + ' ' + (TIPI_EV[e.tipo]||e.tipo) + (e.chi ? ' (' + e.chi + ')' : '') +
      (e.esito ? ' — ' + e.esito : '') + (e.testo ? ': ' + e.testo : '')).join(' | '),
    iniz:P.map(p => p.iniz).filter(Boolean).join('; '),
    naz:[...new Set(P.map(p => p.naz).filter(Boolean))].join('; '),
    lingue:[...new Set(P.flatMap(p => p.lingue))].join('; '),
    eng:P.map(p => p.eng === 'si' ? 'sì' : p.eng === 'base' ? 'base' : p.eng === 'no' ? 'no' : '').filter(Boolean).join('; '),
    ruolo:P.map(p => p.ruolo).filter(Boolean).join('; '),
    pnote:P.map(p => p.note).filter(Boolean).join(' | '),
    autore:L.creatoDa,
  };
  return f.map(k => m[k]);
}
function toCSV(locs, f){
  const q = v => '"' + String(v == null ? '' : v).replace(/"/g,'""') + '"';
  const head = f.map(k => SHARE_FIELDS.find(x => x[0] === k)[1]);
  return '﻿' + [head, ...locs.map(L => rowOf(L, f))].map(r => r.map(q).join(';')).join('\r\n');
}
async function download(name, data, ext){
  const dl = await useCap('downloads');
  if (dl){
    try { await dl.save({ filename:name, data }); logExport(name); return toast('File salvato.'); }
    catch(e){ if (e && e.code === 'declined') return; }
  }
  try { await navigator.clipboard.writeText(data); logExport(name);
    return toast('Salvataggio file non disponibile qui: contenuto copiato negli appunti.'); }
  catch(e){ sheet2('Contenuto da copiare', '<textarea class="inp" style="height:60vh;font-family:var(--mono);font-size:12px">' + esc(data) + '</textarea>'); }
}
function logExport(name){
  DB.audit.push({ il:new Date().toISOString(), chi:DB.me.nome, cosa:name });
  DB.audit = DB.audit.slice(-120); save(true);
}

  const lb = DB.settings.lastBackup, gg = lb ? days(lb) : null;
  const mod = DB.settings.dirty || 0;
  const urgente = !vuoto && (gg === null || gg >= 7 || mod >= 60);
  const stato = vuoto ? 'Archivio ancora vuoto'
    : gg === null ? 'Mai fatto'
    : gg === 0 ? 'Fatto oggi'
    : gg === 1 ? 'Fatto ieri'
    : 'Fatto ' + gg + ' giorni fa';
  const mem = STORAGE.uso > 1048576 ? (STORAGE.uso / 1048576).toFixed(1) + ' MB'
            : STORAGE.uso ? Math.round(STORAGE.uso / 1024) + ' KB' : '—';

    '<button class="btn pri wide" id="bk-now" style="margin-top:11px">' +
      '<svg viewBox="0 0 24 24" style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9"><use href="#i-dl"/></svg>' +
      'Fai il backup adesso</button>' +

async function backupNow(){
  const json = JSON.stringify(DB);
  const nome = 'territori-comiso-' + today() + '.json';
  /* sul telefono il foglio di condivisione è la strada giusta: da lì il file
     va su WhatsApp, in Mail, nei File o in AirDrop verso il Mac */
  try {
    const f = new File([json], nome, { type:'application/json' });
    if (navigator.canShare && navigator.canShare({ files:[f] })){
      await navigator.share({ files:[f], title:'Backup Territori Comiso' });
      DB.settings.lastBackup = today(); DB.settings.dirty = 0; save(true);
      logExport(nome); renderMore(); return toast('Backup condiviso. Conservalo dove lo ritrovi.');
    }
  } catch(e){ if (e && e.name === 'AbortError') return; }
  await download(nome, json, 'json');
  DB.settings.lastBackup = today(); DB.settings.dirty = 0; save(true); renderMore();
}

async function syncSheet(){
  const db = await useCap('db');
  sheet('Portale del gruppo',
   db ? '<p class="hint" style="margin-bottom:14px">Il portale condivide fra i 14 componenti <b>solo i campi non riservati</b>: indirizzo, stato, cronologia, iniziali, nazionalità, lingue. Nome, cognome, telefono e note riservate restano cifrati e non vengono mai decifrati sul dispositivo di nessun altro.</p>' +
     '<div class="row wrap"><button class="btn pri" id="sy-push">Invia le mie modifiche</button>' +
     '<button class="btn" id="sy-pull">Scarica dal gruppo</button></div>' +
     '<p class="hint" style="margin-top:14px">In caso di modifica contemporanea vince la versione più recente. Sincronizza a inizio e fine uscita.</p>'
    : '<div class="note">Il portale condiviso non è attivo in questa visualizzazione.</div>' +
      '<p class="hint">L’app funziona comunque per intero: i dati restano sul tuo dispositivo. Per lavorare in gruppo nel frattempo usa <b>Condividi ed esporta</b> → <b>Backup completo</b> e passatevi il file.</p>',
   { label:'Chiudi', fn:closeSheet });
  if (!db) return;
  const strip = L => { const c = structuredClone(L); c.persone.forEach(p => p.priv = {}); c.priv = {}; return c; };
  $('#sy-push').onclick = async () => {
    try { let n = 0;
      for (const L of DB.locations){ await db.doc('posizioni/' + L.id).set(strip(L)); n++; }
      toast(n + ' posizioni inviate.'); }
    catch(e){ toast('Invio non riuscito: ' + (e.code || 'errore')); }
  };
  $('#sy-pull').onclick = async () => {
    try { const s = await db.collection('posizioni').limit(1000).get();
      let n = 0;
      s.docs.forEach(d => { const r = d.data(); const mine = getLoc(r.id);
        if (!mine){ DB.locations.push(r); n++; }
        else if (r.agg > mine.agg){
          const keepP = mine.persone.map(p => p.priv), keep = mine.priv;
          Object.assign(mine, r); mine.priv = keep;
          mine.persone.forEach((p,i) => { if (keepP[i]) p.priv = keepP[i]; }); n++; } });
      save(true); renderChips(); invalidate(); renderList(); toast(n + ' posizioni aggiornate.'); }
    catch(e){ toast('Scaricamento non riuscito: ' + (e.code || 'errore')); }
  };
}

   ========================================================================= */
const INFORMATIVA = [
 ['Chi tratta i dati','Il gruppo di ricerca che usa questa applicazione è titolare del trattamento. Ogni componente è autorizzato al trattamento e risponde dei dati che inserisce.'],
 ['Quali dati','Indirizzo dell’abitazione, numero di persone nel nucleo, iniziali, sesso, fascia d’età, nazionalità, lingue parlate, appunti sugli incontri e loro data. Facoltativi e riservati: nome, cognome, telefono, note personali.'],
 ['Perché','Organizzare visite in lingua inglese sul territorio, evitare di ripresentarsi a chi non è interessato e non duplicare il lavoro fra i componenti del gruppo.'],
 ['Base giuridica','Interesse legittimo del titolare a organizzare la propria attività (art. 6.1.f GDPR) per i dati di contatto. Per gli appunti che rivelano un orientamento religioso serve il <b>consenso esplicito</b> dell’interessato (art. 9.2.a): registralo con l’interruttore “Informativa consegnata” nella scheda.'],
 ['Categorie particolari','Nazionalità e lingua sono dati comuni, ma vicini all’origine etnica: vanno raccolti solo perché servono a scegliere la lingua del contatto. Le annotazioni su convinzioni religiose sono dati particolari: minimizzale.'],
 ['Chi li vede','I componenti del gruppo vedono i campi condivisi. Nome, cognome, telefono e note riservate sono cifrati e leggibili <b>soltanto</b> da chi li ha inseriti, su quel dispositivo. Nessun dato viene inviato a servizi esterni.'],
 ['Per quanto','I dati sono conservati per il tempo impostato in questa applicazione e poi cancellati. Le posizioni “non interessato” vanno cancellate appena registrato l’esito.'],
 ['Diritti','Chiunque può chiedere accesso, rettifica, cancellazione e opposizione. Alla richiesta, elimina la posizione dalla scheda: la cancellazione è immediata e definitiva.'],
 ['Se qualcuno dice no','Registra “Non interessato” e cancella nome, cognome e telefono. Un rifiuto va rispettato senza raccogliere altro.'],
];
function gdprSheet(){
  const old = DB.locations.filter(L => days(lastDate(L)) > DB.settings.retention * 30);
  sheet('Privacy e GDPR',
   '<div class="note"><b>Regola d’oro.</b> Non annotare mai più di quanto serve a tornare e parlare nella lingua giusta. Un indirizzo, le iniziali, la nazionalità e la data bastano quasi sempre.</div>' +
   '<div class="eyebrow">Informativa da consegnare</div>' +
   '<dl style="margin:0">' + INFORMATIVA.map(([k,v]) =>
     '<div style="padding:10px 0;border-bottom:1px solid var(--line)"><div style="font-family:var(--cond);font-weight:600;font-size:13px;letter-spacing:.02em">' + k + '</div>' +
     '<div style="font-size:13.5px;line-height:1.5;color:var(--ink-2);margin-top:3px">' + v + '</div></div>').join('') + '</dl>' +
   '<div class="row" style="margin-top:12px"><button class="btn wide" id="g-print">Scarica l’informativa da consegnare</button></div>' +
   '<div class="eyebrow">Conservazione</div>' +
   '<label class="f"><span>Cancella automaticamente dopo</span><select class="inp" id="g-ret">' +
     [6,12,18,24,36].map(n => '<option value="' + n + '"' + (DB.settings.retention === n ? ' selected' : '') + '>' + n + ' mesi senza contatti</option>').join('') + '</select></label>' +
   '<div class="kv"><dt>Posizioni oltre la soglia</dt><dd class="mono">' + old.length + '</dd></div>' +
   (old.length ? '<div class="row" style="margin-top:12px"><button class="btn dgr wide" id="g-purge">Cancella le ' + old.length + ' posizioni scadute</button></div>' : '') +
   '<div class="eyebrow">Cancellazione totale</div>' +
   '<p class="hint">Rimuove ogni dato dal dispositivo, senza possibilità di recupero. Esporta un backup prima, se serve.</p>' +
   '<button class="btn dgr wide" id="g-wipe">Cancella tutto l’archivio</button>',
   { label:'Chiudi', fn:closeSheet });
  $('#g-ret').onchange = e => { DB.settings.retention = +e.target.value; save(true); toast('Conservazione aggiornata.'); };
  $('#g-print').onclick = () => download('informativa_privacy.html',
    '<!doctype html><html lang="it"><head><meta charset="utf-8"><title>Informativa</title><style>' +
    'body{font:14px/1.55 -apple-system,system-ui,sans-serif;margin:24px;max-width:34em;color:#111}' +
    'h1{font-size:20px;margin:0 0 4px}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#555;margin:18px 0 3px}' +
    '.f{margin-top:26px;border-top:1px solid #ccc;padding-top:10px;font-size:12px;color:#555}</style></head><body>' +
    '<h1>Informativa sul trattamento dei dati personali</h1><p>Articoli 13 e 14 del Regolamento UE 2016/679.</p>' +
    INFORMATIVA.map(([k,v]) => '<h2>' + k + '</h2><p>' + v + '</p>').join('') +
    '<div class="f">Titolare del trattamento: ________________________  ·  Contatto: ________________________<br>' +
    'Consegnata da ' + esc(DB.me.nome || '____________') + ' il ____ / ____ / ________</div></body></html>', 'html');
  $('#g-purge').onclick = () => { if (!confirm('Cancellare ' + old.length + ' posizioni senza contatti da oltre ' + DB.settings.retention + ' mesi?')) return;
    const ids = new Set(old.map(l => l.id)); DB.locations = DB.locations.filter(l => !ids.has(l.id));
    save(true); closeSheet(); renderChips(); invalidate(); renderMore(); toast(ids.size + ' posizioni cancellate.'); };
  $('#g-wipe').onclick = () => { if (!confirm('Cancellare DEFINITIVAMENTE tutto l’archivio di questo dispositivo?')) return;
    if (!confirm('Ultima conferma: i dati non saranno recuperabili.')) return;
    localStorage.removeItem(KEY); sessionStorage.removeItem(KEY + '.s'); location.reload(); };
}
function setSheet(){
  sheet('Impostazioni',
   '<label class="f"><span>Il tuo nome nel gruppo</span><input class="inp" id="st-n" value="' + esc(DB.me.nome) + '"></label>' +
   '<p class="hint">Compare come autore delle posizioni e dei contatti che registri.</p>' +
   '<label class="f" style="margin-top:14px"><span>Le posizioni tornano nei territori dopo</span><select class="inp" id="st-sc">' +
     [7,10,14,21,30,45,60].map(n => '<option value="' + n + '"' + (DB.settings.scadenza === n ? ' selected' : '') + '>' + n + ' giorni</option>').join('') + '</select></label>' +
   '<label class="f"><span>Tema</span><div class="seg" id="st-th">' +
     [['auto','Automatico'],['light','Chiaro'],['dark','Scuro']].map(([v,l]) =>
       '<button data-th="' + v + '" aria-pressed="' + (DB.settings.tema === v) + '">' + l + '</button>').join('') + '</div></label>' +
   '<div class="eyebrow">PIN personale</div>' +
   '<p class="hint">' + (DB.me.ver ? 'Un PIN è già impostato. Cambiandolo, i dati riservati già salvati con il vecchio PIN non saranno più leggibili.' : 'Senza PIN i campi riservati vengono salvati in chiaro sul dispositivo. Impostarlo è consigliato.') + '</p>' +
   '<label class="f"><span>Nuovo PIN</span><input class="inp" id="st-p" type="password" inputmode="numeric" autocomplete="new-password" placeholder="almeno 4 caratteri"></label>' +
   '<button class="btn wide" id="st-pok">' + (DB.me.ver ? 'Cambia PIN' : 'Imposta PIN') + '</button>' +
   (locked() ? '<button class="btn pri wide" id="st-unl" style="margin-top:8px">Sblocca archivio</button>' : '') +
   '<div class="eyebrow">Applicazione</div>' +
   '<p class="hint">Su iPhone: apri il link in Safari, tocca <b>Condividi</b> e poi <b>Aggiungi a Home</b>. L’app parte a schermo intero e funziona anche senza rete — la mappa di Comiso è incorporata nella pagina.</p>' +
   '<dl style="margin:0"><div class="kv"><dt>Versione</dt><dd class="mono">beta 1.0 · Comiso</dd></div>' +
   '<div class="kv"><dt>Cartografia</dt><dd>OpenStreetMap (ODbL)</dd></div>' +
   '<div class="kv"><dt>Dati demografici</dt><dd>ISTAT 01/01/2025</dd></div></dl>',
   { label:'Chiudi', fn:closeSheet });
  $('#st-n').onchange = e => { DB.me.nome = e.target.value.trim(); save(true); renderMore(); };
  $('#st-sc').onchange = e => { DB.settings.scadenza = +e.target.value; save(true); invalidate(); toast('Scadenza aggiornata.'); };
  $('#st-th').onclick = e => { const b = e.target.closest('[data-th]'); if (!b) return;
    DB.settings.tema = b.dataset.th; applyTheme(); save(true);
    $('#st-th').querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b)); };
  $('#st-pok').onclick = async () => { const p = $('#st-p').value;
    if (p.length < 4) return toast('Il PIN deve avere almeno 4 caratteri.');
    await setupIdentity(DB.me.nome, p); toast('PIN impostato.'); closeSheet(); };
  const u = $('#st-unl');
  if (u) u.onclick = async () => { const p = prompt('Inserisci il tuo PIN');
    if (p == null) return; if (await unlock(p)){ toast('Archivio sbloccato.'); closeSheet(); renderMore(); }
    else toast('PIN errato.'); };
}
function applyTheme(){
  const t = DB.settings.tema;
  if (t === 'auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme', t);
  invalidate();
}
/* ---------------- schermata iniziale ---------------- */
function gate(){
  const g = document.createElement('div'); g.className = 'gate';
  g.innerHTML = '<div class="in">' +
   '<h1>Territori Comiso</h1>' +
   '<p class="l">Mappa e schedario per il lavoro in lingua inglese. I dati restano sul tuo dispositivo; i campi identificativi vengono cifrati con un PIN che conosci solo tu.</p>' +
   '<label class="f"><span>Come ti chiami</span><input class="inp" id="gt-n" placeholder="Nome e cognome" autocomplete="name"></label>' +
   '<label class="f"><span>PIN personale</span><input class="inp" id="gt-p" type="password" inputmode="numeric" autocomplete="new-password" placeholder="almeno 4 caratteri"></label>' +
   '<p class="hint" style="margin-bottom:16px">Serve a cifrare nome, cognome e telefono delle persone che schedi. Se lo dimentichi quei campi non sono più recuperabili: gli altri dati restano.</p>' +
   '<div class="tog" style="border:none;padding:0 0 14px"><div class="lb">Ho letto l’informativa privacy<small>Mi impegno a consegnarla a chi schedo e a registrare il consenso</small></div>' +
     '<button class="sw" id="gt-c" aria-pressed="false"></button></div>' +
   '<button class="btn pri wide" id="gt-go">Inizia</button>' +
   '<button class="btn gho wide" id="gt-i" style="margin-top:8px">Leggi l’informativa</button></div>';
  document.body.appendChild(g);
  let ok = false;
  g.querySelector('#gt-c').onclick = e => { ok = !ok; e.currentTarget.setAttribute('aria-pressed', ok); };
  g.querySelector('#gt-i').onclick = () => alert(INFORMATIVA.map(([k,v]) => k.toUpperCase() + '\n' + v.replace(/<[^>]+>/g,'')).join('\n\n'));
  g.querySelector('#gt-go').onclick = async () => {
    const n = g.querySelector('#gt-n').value.trim(), p = g.querySelector('#gt-p').value;
    if (!n) return toast('Scrivi il tuo nome.');
    if (p && p.length < 4) return toast('Il PIN deve avere almeno 4 caratteri.');
    if (!ok) return toast('Conferma di aver letto l’informativa.');
    await setupIdentity(n, p); DB.settings.informativa = true; save(true);
    g.remove(); boot();
  };
}
function lockGate(){
  const g = document.createElement('div'); g.className = 'gate';
  g.innerHTML = '<div class="in"><h1>Bentornato, ' + esc(DB.me.nome.split(' ')[0]) + '</h1>' +
   '<p class="l">Inserisci il PIN per leggere i campi riservati. Puoi anche continuare senza: vedrai tutto tranne nomi e telefoni.</p>' +
   '<label class="f"><span>PIN</span><input class="inp" id="lk-p" type="password" inputmode="numeric" autocomplete="current-password"></label>' +
   '<button class="btn pri wide" id="lk-go">Sblocca</button>' +
   '<button class="btn gho wide" id="lk-sk" style="margin-top:8px">Continua senza</button></div>';
  document.body.appendChild(g);
  const tryIt = async () => { if (await unlock(g.querySelector('#lk-p').value)){ g.remove(); boot(); }
    else toast('PIN errato.'); };
  g.querySelector('#lk-go').onclick = tryIt;
  g.querySelector('#lk-p').onkeydown = e => { if (e.key === 'Enter') tryIt(); };
  g.querySelector('#lk-sk').onclick = () => { g.remove(); boot(); };
  setTimeout(() => g.querySelector('#lk-p').focus(), 300);
}
/* ---------------- avvio ---------------- */
function boot(){
  applyTheme(); rebuildTerr(); rebuildCov(); renderChips(); resize(); invalidate(); go('map');
  const n = DB.locations.filter(isScaduta).length;
  if (n) setTimeout(() => toast(n + (n === 1 ? ' posizione è tornata' : ' posizioni sono tornate') + ' nei territori.'), 900);
}
(async function start(){
  await initStorage();
  if (!DB.me.nome) return gate();
  const s = sessionStorage.getItem(KEY + '.s');
  if (DB.me.ver && s && await unlock(s)) return boot();
  if (DB.me.ver) return lockGate();
  boot();
})();
</script>

<script>
if ('serviceWorker' in navigator)
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
</html>
